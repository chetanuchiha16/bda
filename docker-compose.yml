services:
  master-node:
    build:
      context: ./docker
      dockerfile: Dockerfile.hadoop
    image: bda-hadoop:3.3.6
    container_name: bda-master-node
    hostname: master-node
    environment:
      - ROLE=master
    ports:
      - "9870:9870"    # NameNode Web UI
      - "8088:8088"    # YARN ResourceManager Web UI
      - "9000:9000"    # HDFS DefaultFS
      - "19888:19888"  # MapReduce JobHistory Web UI
    volumes:
      - ./:/workspace
      - hadoop_namenode:/hadoop/data/hdfs/namenode
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.10
    depends_on:
      - worker-node-1
      - worker-node-2
    restart: unless-stopped

  worker-node-1:
    build:
      context: ./docker
      dockerfile: Dockerfile.hadoop
    image: bda-hadoop:3.3.6
    container_name: bda-worker-node-1
    hostname: worker-node-1
    environment:
      - ROLE=worker
    ports:
      - "9864:9864"    # DataNode 1 Web UI
    volumes:
      - hadoop_datanode1:/hadoop/data/hdfs/datanode
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.11
    restart: unless-stopped

  worker-node-2:
    build:
      context: ./docker
      dockerfile: Dockerfile.hadoop
    image: bda-hadoop:3.3.6
    container_name: bda-worker-node-2
    hostname: worker-node-2
    environment:
      - ROLE=worker
    ports:
      - "9865:9864"    # DataNode 2 Web UI
    volumes:
      - hadoop_datanode2:/hadoop/data/hdfs/datanode
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.12
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: bda-mongodb
    hostname: mongodb
    ports:
      - "27017:27017"  # MongoDB Port
    volumes:
      - mongo_data:/data/db
    networks:
      hadoop_net:
        ipv4_address: 172.20.0.20
    restart: unless-stopped

networks:
  hadoop_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  mongo_data:
